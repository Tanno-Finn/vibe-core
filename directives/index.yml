      four cases + verb aspect + pro-drop, comma-decimal/dot-grouping numbers + trailing €,
      native-calque AI terminology, el-easy pendant (Κείμενο για Όλους easy-to-read tradition — no
      codified national plain-language standard). Agent-native research (Unicode/CLDR/Centre for
      the Greek Language/Triantafyllidis-sourced). Register εσύ approved (informal singular;
      agreement cascades, never mixed). Planned, native review pending.

  - id: lang-hr
    file: directives/languages/hr.md
    layer: base
    summary: >-
      Croatian (hrvatski) translation guide — 30-letter Latin/Gajica alphabet (č ć đ š ž +
      digraphs dž lj nj), „…" quotes, 7-case morphology + verbal aspect + gender agreement + no
      articles, comma-decimal/space-grouping numbers + € (euro since 2023), Struna-anchored
      terminology, hr-easy pendant (plain-language tradition thin/recent), and
      Croatian-vs-Serbian/Bosnian/Montenegrin neutrality (Latin-only, ijekavian, native
      vocabulary). Agent-native research (Institut za hrvatski
      jezik/pravopis.hr/Struna/mfin.gov.hr-sourced). Register ti approved (Vi documented as the
      formal alternative — pick one globally). Planned, native review pending.

  - id: lang-ro
    file: directives/languages/ro.md
    layer: base
    summary: >-
      Romanian (română) translation guide — Latin alphabet with ă â î and comma-below ș ț
      (U+0219/U+021B — NOT the cedilla forms U+015F/U+0163, the single biggest encoding hazard),
      the â/î spelling rule, „…" quotes with «…» nesting, postposed definite article + three
      genders incl. neuter + case agreement, comma-decimal numbers + trailing lei, terminology
      strategy, ro-easy pendant (no codified easy-read standard — honest gap), RO/MD neutrality.
      Agent-native research (Academia Română/DOOM3/dexonline-sourced). Register tu approved
      (dumneavoastră for legal/consent text). Planned, native review pending.

  - id: lang-ms
    file: directives/languages/ms.md
    layer: base
    summary: >-
      Malay (Bahasa Melayu, Malaysian standard) translation guide — Rumi/Latin, no diacritics, so
      the traps are lexical and numeric, not typographic. Headline hazard: the ms/id number
      inversion (decimal separator and grouping exactly reversed, and the 10⁹ compact suffix
      differs) — a silent order-of-magnitude bug whenever an id string is reused. Grammar
      centrepiece: Hukum Aneksi Persona (first/second-person passives take no di-). Terminology
      runs on the tri-national MABBIM tables, with Kamus Dewan's inline Id sense label as a
      divergence detector; ms/id false friends verified. Register: anda, lowercase. Full detail in
      the guide.

  - id: lang-vi
    file: directives/languages/vi.md
    layer: base
    summary: >-
      Vietnamese (tiếng Việt) translation guide — Latin chữ Quốc ngữ, where every failure renders
      as working text, so the center of gravity is encoding. NFC is the interchange form;
      Windows-1258 still generates decomposed text that looks right and fails comparison. Key
      diagnostics: đ survives the mark-stripping that mangles ă â ê ô ơ ư (that pattern is a
      normalization bug, not an encoding one), and kiểu cũ vs kiểu mới spelling is NOT a
      normalization difference — it needs its own lint. Numbers invert English (decimal comma,
      group period). Register: bạn, plus avoidance-by-construction via hãy + verb. Full detail in
      the guide.

  - id: lang-ta
    file: directives/languages/ta.md
    layer: base
    summary: >-
      Tamil (தமிழ்) translation guide — abugida U+0B80–U+0BFF, the one script in this series where
      NFC repairs damage rather than freezing it (the two-part vowels round-trip) — but NFC is
      only a floor: it never touches the U+0B82-for-U+0BCD substitution, the U+0BCC homoglyph,
      smuggled Telugu codepoints, or the ஸ்ரீ/ஶ்ரீ split. Script facts machine-verified: puḷḷi is
      U+0BCD, never the look-alike anusvara U+0B82; six of eleven vowel signs render before/around
      a consonant they are stored after, so truncation must run on grapheme clusters; āytam ஃ is
      how Tamil spells f. Numbers: Indian grouping in ta/ta_LK plus digit/letter font confusables.
      Full detail in the guide.

  - id: lang-te
    file: directives/languages/te.md
    layer: base
    summary: >-
      Telugu (తెలుగు) translation guide — abugida U+0C00–U+0C7F, mechanically forgiving where the
      other Indic scripts are not: exactly one character decomposes, NFC round-trips, and there
      are no pre-base vowel signs (do not port the Devanagari left-side-vowel trap). The real
      hazard is ZWNJ, quantified across four corpora: virama+ZWNJ+consonant is load-bearing at the
      stem-suffix seam of transliterated compounds, while roughly one in four occurrences is
      word-final noise. Two rules: never strip virama+ZWNJ+consonant, and never use ZWNJ as a diff
      or equality signal. U+0C55 analytic sequences and archaic U+0C5D are non-normalizing traps
      NFC will never repair. Full detail in the guide.

  - id: lang-de
    file: directives/languages/de.md
    layer: base
    summary: >-
      German (Deutsch) guide for the kit's own reference language — describes observed practice
      from a scripted census of the shipped strings, no external research: du register (~91 %,
      Sie in legal pages, ELIZA and drift), generic masculine with no gender-star forms, „…“ as
      majority quotes beside »…« and ASCII, decimal comma + dot grouping, glued vs spaced percent
      split. de-easy is labeled Einfache Sprache (not Leichte Sprache) and measured against de
      on the kit's own paired files: 6.05 vs 11.12 words per sentence, clauses split rather than
      words swapped. Register, gender, and compound style flagged as open user decisions.

  - id: lang-en
    file: directives/languages/en.md
    layer: base
    summary: >-
      English guide for the kit's own second language — describes observed practice from a
      scripted census, no external research: direct "you" with contractions, straight quotes,
      American spelling in the majority (332 vs 128) but British day-month-year dates, serial
      comma about half the time, German-leak patterns (hyphenated compounds, spaced percent,
      KI). en-easy is labeled Plain Language (not certified Easy Read) and measured against en
      on the kit's paired files: 6.40 vs 12.05 words per sentence. Variety and serial comma
      flagged as open user decisions.
