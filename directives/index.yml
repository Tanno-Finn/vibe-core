  - id: lang-tl
    file: directives/languages/tl.md
    layer: base
    summary: >-
      Filipino (Filipino / Tagalog) translation guide — content key `tl`, UI label "Filipino", and
      **`fil-PH` passed explicitly to anything locale-aware**, because the locale registry
      canonicalizes `tl` to `fil` and no `tl` data file exists; legally Filipino is the national
      language and Tagalog one of the major languages, so the labels are not interchangeable.
      Orthography, punctuation, numbers, dates, and money are **legislated** by the national
      language commission: decimals are `1,234.56` (period decimal, comma grouping) and quotation
      glyphs are prescribed by codepoint. Integration catch: the locale data's ordinal rules emit
      forms that contradict the mandated `ika-` hyphenation, so ordinal output must not ship
      unmodified. Grammar traps are the focus/trigger system, the ang/ng/sa markers, `ng` vs
      `nang`, enclitic order and tayo/kami. Register: `ka`/`mo`, **no `po`** — established by
      counting six official learner modules, none of which uses `po` in its own instructional
      voice. No plain-language standard exists, though official clear-writing rules do. Planned,
      native review pending.

  - id: lang-id
    file: directives/languages/id.md
    layer: base
    summary: >-
      Indonesian (bahasa Indonesia) translation guide — Latin script, no tense, no gender, no
      number marking, so the traps are lexical and editorial rather than technical. **EYD V (2022)
      is the current spelling norm and anything citing PUEBI is stale** — the branding reverted to
      the older name, which is exactly why outdated material reads as current. Terminology is
      anchored on the national term bank with citable record IDs (algoritma, not the non-standard
      algoritme; saraf, not syaraf), and the pembelajaran/pemelajaran split is resolved for usage
      with the official form as a gloss. Highest-risk single string: "free of charge" is **gratis,
      never percuma** — whose first dictionary sense is "in vain". Register: Anda, capitalized and
      sparing, paired with pronoun-free impersonal phrasing. No easy-read standard exists; the
      id-easy pendant is anchored on a labeled substitute. Planned, native review pending.

  - id: lang-mr
    file: directives/languages/mr.md
    layer: base
    summary: >-
      Marathi (मराठी) translation guide — Balbodh Devanagari that is emphatically not Hindi.
      Headline hazard: the **eyelash reph is U+0930 U+094D U+200D**, never U+0931 (which is the
      Dravidian alveolar r and decomposes to र + nukta) — and because U+0931 is not a composition
      exclusion while the ZWJ sequence is untouched by normalization, **you cannot normalize your
      way to correct eyelash spellings; the ZWJ must be whitelisted**, and stripping it collapses
      the form while still passing visual QA. Also Marathi-only ळ, three genders where Hindi has
      two, ergative alignment, lakh/crore grouping, and the finding that **no computing paribhasha
      kosh exists**, so there is no official Marathi AI/ML terminology at all and loanwords lead.
      Register: तुम्ही (the आपण counter-position is documented). Planned, native review pending.

  - id: lang-pa
    file: directives/languages/pa.md
    layer: base
    summary: >-
      Punjabi (ਪੰਜਾਬੀ) translation guide — Gurmukhi base (pa-Guru-IN), chosen against the raw
      speaker split and saying so: this guide does not serve the ~89 million Shahmukhi readers,
      because a bare `pa` locale resolves to Gurmukhi and Shahmukhi is a full right-to-left locale
      rather than a script swap. Headline hazard: all six precomposed nukta letters are Unicode
      composition exclusions, so NFC leaves them decomposed and unnormalized comparison silently
      breaks lookups. Also 2,2,3 lakh grouping (test at ≥ 100,000 — below one lakh the systems
      agree), Western digits per CLDR, and a plural rule where "one" covers 0–1. Register: ਤੁਸੀਂ
      including imperatives — verb morphology changes with it, so it cannot be flipped late.
      Planned, native review pending.

