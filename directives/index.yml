# Directives registry
#
# One row per directive file so agents (and skills) can locate a directive by id
# without loading every doc into context (Constitution Principle 6 — "shape, don't
# over-document"). Keep this in sync with the files: scripts/verify-harness.mjs checks
# that every listed file exists AND that no directive file is left out of this index —
# recursively, subfolders included.
#
# One documented exception: `directives/languages/<code>.setup.md`. A language guide is
# deliberately two files (see directives/language-guide-authoring.md §"Two files, one
# guide"); the `.setup.md` half is the once-per-language companion of `<code>.md` and is
# reached through it, so it is covered by its sibling's row rather than earning one of
# its own. The gate enforces exactly that: a `*.setup.md` is exempt ONLY while the
# sibling `<name>.md` exists AND is listed here. Any other unlisted file is an orphan.
#
# Quoting convention: every `summary:` is a folded block scalar (`>-`), never a bare
# plain scalar. Prose summaries collect colons, hashes, and dashes, and a plain scalar
# turns those into YAML syntax — that is exactly how the guide-authoring row once made
# this whole file unparseable while the gate still reported "harness intact". A block
# scalar cannot be broken by its content. verify-harness enforces this.
#
# A directive is durable know-how that guides how work is done but does NOT gate.
# (A standard gates and has an ID; the Constitution says why; a skill is a task.)
# All directives here are layer: base — they hold even in a non-Angular kit.

version: 1

directives:
