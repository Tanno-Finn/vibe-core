      unexplained lockfile growth), the check-in shape, the paydown pointer to security-workflow,
      and the limits (no security guarantees, never paste a found secret, no watch level softens a
      safety warning).

  - id: watch-accessibility
    file: directives/watch/accessibility.md
    layer: base
    summary: >-
      Watch playbook — barriers creeping into what gets built: why it is cheap woven in and
      expensive retrofitted, the radar (meaning locked in images or color, wrong element for the
      job, keyboard gaps, missing accessible names, contrast-gate misses, unrespected
      reduced-motion), the check-in shape, the paydown pointer to accessibility-workflow, and the
      limits (no compliance claims, no opt-out by watch level).

  - id: watch-tech-debt
    file: directives/watch/tech-debt.md
    layer: base
    summary: >-
      Watch playbook — shortcuts that get expensive later: why unknown debt is the only bad kind,
      the radar (deliberate shortcuts named as taken, untested load-bearing changes, three entries
      on one spot, TODO inventory, red drift/harness gates, majors gap), the check-in shape, the
      paydown pointer to maintenance, and the limits (no refactor smuggled into another task, no
      aesthetic findings, no coverage fetish).

  - id: watch-privacy
    file: directives/watch/privacy.md
    layer: base
    summary: >-
      Watch playbook — data about real people: why almost every privacy problem is an accident of
      convenience, the radar (outside hosts embedded, real personal data in the repo, user content
      sent to third parties, default-on measurement, growing browser storage, pupil data), the
      check-in shape, the paydown recipes (click-to-play embeds, local typefaces, synthetic test
      data, consent state in one place, a way to clear), and the limits (no legal advice, hard
      rules never quieted by level, never reproduce a found value).

  - id: watch-cost
    file: directives/watch/cost.md
    layer: base
    summary: >-
      Watch playbook — money and effort: why the price tag belongs on the table before the step,
      the radar (anything that spends or starts a subscription, free tiers with a ceiling, large
      batches, growing dependency count and build time, projections that came in far above), the
      check-in shape with the say-the-number/measure-one-unit rules, the paydown moves, and the
      limits (nothing bought silently, no invented numbers, thrift is not the value).

  - id: watch-performance
    file: directives/watch/performance.md
    layer: base
    summary: >-
      Watch playbook — speed on an old phone: why the decline is gradual, the radar (build budget
      warnings in angular.json, oversized images, eager imports, unstopped loops, static routes
      missing from prerender-routes.txt, bundle growth against the build manifest), the check-in
      shape, the paydown order (images, first-view code, prerendering), and the limits (default
      quiet, no numbers without the shipped build, never at the cost of accessibility).

  - id: watch-seo
    file: directives/watch/seo.md
    layer: base
    summary: >-
      Watch playbook — findability: why it matters in plain words, the radar (missing
      title/description keys, heading structure, prerender and sitemap coverage, dead links), the
      check-in shape, the paydown recipe, and the honesty limits (no ranking promises, never at
      the cost of privacy or accessibility).

